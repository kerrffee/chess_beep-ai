# GitHub에 올릴(push) 때마다 자동으로 게임을 빌드해서 GitHub Pages에 배포함
# (GitHub 서버가 대신 npm ci → npm run build를 하고, 나온 dist 폴더를 웹사이트로 올림)
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 다시 돌릴 수도 있게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
